name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# pushes to main are serialized — the version is last-tag patch+1, so two
# runs racing would mint the same version
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          set -euo pipefail
          # newest semver tag wins; first release falls back to Cargo.toml
          last=$(git tag -l 'v*' | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
          if [ -n "$last" ]; then
            ver=$(awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}' <<< "${last#v}")
          else
            ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # bake the release version into the binary so --version agrees with
      # the tag; lock keeps the root package's own version, so stamp both.
      # awk + bash: macOS ships BSD sed (no -i/0,/re/) and Windows defaults
      # to pwsh
      - name: Stamp version
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ needs.version.outputs.version }}"
          awk -v v="$ver" '!f && /^version = "/ {sub(/"[^"]*"/, "\"" v "\""); f=1} 1' \
            Cargo.toml > Cargo.toml.stamped && mv Cargo.toml.stamped Cargo.toml
          awk -v v="$ver" '/^name = "rsusage"$/ {f=1} f && /^version = "/ {sub(/"[^"]*"/, "\"" v "\""); f=0} 1' \
            Cargo.lock > Cargo.lock.stamped && mv Cargo.lock.stamped Cargo.lock
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          bin="rsusage"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then bin="rsusage.exe"; fi
          mkdir -p stage dist
          cp "target/${{ matrix.target }}/release/$bin" LICENSE stage/
          tar -czf "dist/rsusage-${{ needs.version.outputs.version }}-${{ matrix.name }}.tar.gz" -C stage "$bin" LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/rsusage-${{ needs.version.outputs.version }}-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: rsusage v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

  aur:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      AUR_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Check AUR secret
        run: |
          if [ -z "$AUR_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY secret is not set — skipping AUR publish"
            exit 0
          fi
      - uses: actions/checkout@v4
        if: env.AUR_PRIVATE_KEY != ''
      - name: Fetch checksums
        if: env.AUR_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          ver="${{ needs.version.outputs.version }}"
          curl -fsSL -o bin.tar.gz \
            "https://github.com/Coobyk/rsusage/releases/download/v${ver}/rsusage-${ver}-linux-x86_64.tar.gz"
          curl -fsSL -o src.tar.gz \
            "https://github.com/Coobyk/rsusage/archive/refs/tags/v${ver}.tar.gz"
          { echo "sum_bin=$(sha256sum bin.tar.gz | cut -d' ' -f1)"
            echo "sum_src=$(sha256sum src.tar.gz | cut -d' ' -f1)"; } >> "$GITHUB_ENV"
      - name: Render PKGBUILD and .SRCINFO
        if: env.AUR_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          ver="${{ needs.version.outputs.version }}"
          for pkg in rsusage rsusage-bin; do
            mkdir -p "out/$pkg"
            sum="$sum_bin"
            [ "$pkg" = rsusage ] && sum="$sum_src"
            sed -e "s/^pkgver=.*/pkgver=${ver}/" \
                -e "s/^sha256sums=.*/sha256sums=('${sum}')/" \
                "packaging/aur/$pkg/PKGBUILD" > "out/$pkg/PKGBUILD"
            sed -e "s/__VER__/${ver}/g" -e "s/__SUM__/${sum}/g" \
                "packaging/aur/$pkg/.SRCINFO" > "out/$pkg/.SRCINFO"
          done
      - name: Publish to AUR
        if: env.AUR_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for pkg in rsusage rsusage-bin; do
            if ! git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "aur-${pkg}" 2>/dev/null; then
              mkdir "aur-${pkg}" && git -C "aur-${pkg}" init -b master
            fi
            cp "out/${pkg}/PKGBUILD" "out/${pkg}/.SRCINFO" "aur-${pkg}/"
            git -C "aur-${pkg}" add PKGBUILD .SRCINFO
            if git -C "aur-${pkg}" diff --cached --quiet; then
              echo "$pkg already up to date"
              continue
            fi
            git -C "aur-${pkg}" commit -m "$pkg ${{ needs.version.outputs.version }}"
            # first push creates the package; subsequent pushes update it
            git -C "aur-${pkg}" push "ssh://aur@aur.archlinux.org/${pkg}.git" HEAD:master
            echo "published $pkg"
          done
