[package]
name = "rsusage"
version = "0.1.0"
edition = "2021"
description = "Blazing fast usage reports for coding agents — a Rust rewrite of ccusage"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
jiff = "0.2"
ureq = "3"
rayon = "1"
unicode-width = "0.2"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
bincode = "1"
rustc-hash = "2"
mimalloc = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
